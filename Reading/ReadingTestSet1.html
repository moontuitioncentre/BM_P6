function watchBattle(){

    let battlePlayers = {};


    function renderBattle(){

        const now = Date.now();


        let players =
            Object.values(battlePlayers)
            .filter(player => {

                // 不是测试中的学生
                if(player.status !== "playing"){
                    return false;
                }


                // 没有心跳资料
                if(!player.lastActive){
                    return false;
                }


                // 超过 10 秒没有心跳
                // 就认为页面已经离开
                if(
                    now - player.lastActive
                    > 10000
                ){

                    return false;

                }


                return true;

            });


        // 正确率高的排前面
        players.sort(
            (a,b) =>
            b.accuracy - a.accuracy
        );


        let html = "";


        players.forEach(
            (player,index)=>{

                let medal = "";


                if(index === 0){
                    medal = "🥇";
                }
                else if(index === 1){
                    medal = "🥈";
                }
                else if(index === 2){
                    medal = "🥉";
                }


                html += `

                <span class="battle-player">

                    ${medal}
                    ${player.studentName}
                    ${player.accuracy}%

                </span>

                `;

            }
        );


        document.getElementById(
            "battleRanking"
        ).innerHTML = html;

    }


    // =========================
    // Firebase 实时监听
    // =========================

    window.onSnapshot(

        window.collection(
            window.db,
            "liveBattle"
        ),

        (snapshot)=>{

            snapshot.forEach((doc)=>{

                const data = doc.data();

                battlePlayers[doc.id] = data;

            });


            renderBattle();

        }

    );


    // =========================
    // 每1秒检查在线状态
    // =========================

    clearInterval(
        window.battleDisplayTimer
    );


    window.battleDisplayTimer =
        setInterval(()=>{

            renderBattle();

        },10000);

}

function checkAnswer(text) {
    if (isChecking) {
        return;
    }

    isChecking = true;

    if (!words[current]) {
        isChecking = false;
        return;
    }

    // 标准化马来文：统一大小写、标点和空格
    function normalizeMalay(value) {
        return String(value || "")
            .toLowerCase()
            .replace(/[.,!?;:"“”‘’()[\]{}]/g, " ")
            .replace(/\s+/g, " ")
            .trim();
    }

    const answer = normalizeMalay(words[current]);
    const cleanText = normalizeMalay(text);

    console.log("学生读出的内容:", cleanText);
    console.log("目标词汇:", answer);

    // 没有识别到语音，不直接判对
    if (!cleanText || !answer) {
        isChecking = false;
        resultDiv.innerHTML = "❌ 没有听清楚，请再试一次";
        return;
    }

    
    // ===== 马来文宽松发音判断 =====

    const targetCompact = answer.replace(/\s+/g, "");
    const spokenTokens = cleanText.split(/\s+/).filter(Boolean);
    const targetTokenCount = answer.split(/\s+/).length;

    let similarity = 0;

    // 忽略空格，例如：
    // dikitar 和 di kitar 可以视为相同
    // alam sekitar 和 alamsekitar 可以视为相同
    if (
        targetCompact.length >= 5 &&
        spokenTokens.join("").includes(targetCompact)
    ) {
        similarity = 1;
    }

    // 比较连续词组，允许 Chrome 把一个词拆成两个词
    // 或把两个词识别成相近的连续词
    for (
        let start = 0;
        start < spokenTokens.length;
        start++
    ) {
        for (
            let count = Math.max(1, targetTokenCount - 1);
            count <= targetTokenCount + 1;
            count++
        ) {
            if (start + count > spokenTokens.length) {
                continue;
            }

            const spokenCandidate = spokenTokens
                .slice(start, start + count)
                .join("")
                .replace(/[^a-z]/g, "");

            if (!spokenCandidate) {
                continue;
            }

            const maxLength = Math.max(
                targetCompact.length,
                spokenCandidate.length
            );

            const distance = levenshtein(
                targetCompact,
                spokenCandidate
            );

            const wordSimilarity =
                1 - distance / maxLength;

            if (wordSimilarity > similarity) {
                similarity = wordSimilarity;
            }
        }
    }

    // 更宽松的判断标准
    let threshold;

    // 特别处理容易被 Chrome 误识别的马来文
    if (targetCompact === "tin") {
        threshold = 0.50;
    } else if (targetCompact === "majmuk") {
        threshold = 0.55;
    } else if (targetCompact.length <= 3) {
        threshold = 0.90;
    } else if (targetCompact.length <= 7) {
        threshold = 0.72;
    } else {
        threshold = 0.70;
    }

    console.log("学生识别结果:", cleanText);
    console.log("目标词汇:", answer);
    console.log("相似度:", similarity);
    console.log("判断标准:", threshold);


    if (similarity >= threshold) {
        // ===== 答对 =====
        stopListening();
        isChecking = false;

        correct++;

        updateBattleFirebase();

        testedWordsToday.push({
            word: words[current],
            result: "correct"
        });

        // 从不会读的词汇列表移除
        wrongWords = wrongWords.filter(
            word => word !== words[current]
        );

        document.body.className = "correct";
        resultDiv.innerHTML = "✅ 正确！";

        setTimeout(() => {
            current++;

            if (current < words.length) {
                showWord();
            } else {
                showResult();
            }
        }, 800);

    } else {
        // ===== 答错：允许学生重读 =====
        isChecking = false;

        const currentWord = words[current];

        const exist = testedWordsToday.find(
            item => item.word === currentWord
        );

        if (!exist) {
            testedWordsToday.push({
                word: currentWord,
                result: "wrong"
            });
        }

        document.body.className = "incorrect";
        resultDiv.innerHTML = "❌ 再试一次";
    }
}

);

// =======================

function selectRange(){

    let start = prompt("请输入开始词汇或序号");

    // 点击 Cancel 时，不进行任何操作
    if(start === null) return;

    let end = prompt("请输入结束词汇或序号");

    // 点击 Cancel 时，不进行任何操作
    if(end === null) return;

    start = start.trim();
    end = end.trim();

    // 支持输入词汇，也支持输入序号（从 1 开始）
    let startIndex = /^\d+$/.test(start)
        ? Number(start) - 1
        : originalWords.indexOf(start);

    let endIndex = /^\d+$/.test(end)
        ? Number(end) - 1
        : originalWords.indexOf(end);

    // 检查输入是否有效
    if(
        startIndex < 0 ||
        endIndex < 0 ||
        startIndex >= originalWords.length ||
        endIndex >= originalWords.length ||
        startIndex > endIndex
    ){
        alert("词汇或序号无效，请重新输入");
        return;
    }

    // 防止刷新导致进度消失
    selectedRange = originalWords.slice(
        startIndex,
        endIndex + 1
    );

    restart();

}

// =======================
// 英文发音相似度判断
// =======================

function getSimilarity(a,b){

if(a.includes(b) || b.includes(a)){
return 1;
}


let longer =
a.length > b.length ? a : b;


let shorter =
a.length > b.length ? b : a;


let longerLength =
longer.length;


if(longerLength === 0){
return 1;
}


let distance =
levenshtein(longer, shorter);


return (
longerLength - distance
) / longerLength;

}



// 编辑距离算法

function levenshtein(a,b){

let matrix=[];


for(let i=0;i<=b.length;i++){

matrix[i]=[i];

}


for(let j=0;j<=a.length;j++){

matrix[0][j]=j;

}



for(let i=1;i<=b.length;i++){

for(let j=1;j<=a.length;j++){


if(
b.charAt(i-1)
===
a.charAt(j-1)
){

matrix[i][j]=matrix[i-1][j-1];

}

else{


matrix[i][j]=Math.min(

matrix[i-1][j-1]+1,

matrix[i][j-1]+1,

matrix[i-1][j]+1

);


}


}

}


return matrix[b.length][a.length];

}

function normalizeChinese(text){

return text
.trim()
.replace(/[，。！？、；：“”‘’（）,.!?;:"'「」『』]/g,"")
.replace(/\s+/g,"");

}

function chineseSimilarity(a,b){

a = normalizeChinese(a);

b = normalizeChinese(b);


if(a === b){

return 1;

}


if(!a || !b){

return 0;

}


let distance =
levenshtein(a,b);


let maxLength =
Math.max(
a.length,
b.length
);


return (
maxLength - distance
) / maxLength;

}
